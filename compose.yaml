services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tfle
      POSTGRES_USER: tfle
      POSTGRES_PASSWORD: tfle
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tfle -d tfle"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    ports:
      - "8000:8000"
    environment:
      TFLE_DATABASE_URL: postgresql+psycopg://tfle:tfle@postgres:5432/tfle
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    ports:
      - "5173:5173"

volumes:
  postgres_data:
